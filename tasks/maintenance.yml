---
# When expector_check_maintenance_systemd_unit is true (include gate in expector.yml):
# probe expector_maintenance_systemd_unit. If active:
#   - set expector_maintenance_active (Verify still runs; Remediate is suppressed)
#   - record an informational MAINTENANCE row
# Failures on this host are visible in the full report but excluded from alerting
# (summary checks_failed / errors report / failed notifications).

- name: Maintenance | Probe unit active state
  when: (expector_maintenance_systemd_unit | default('') | string | trim | length) > 0
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ expector_maintenance_systemd_unit | trim }}"
  register: _maint_active
  failed_when: false
  changed_when: false

- name: Maintenance | Clear flag when unit inactive or unset
  when: >-
    (expector_maintenance_systemd_unit | default('') | string | trim | length) == 0
    or (_maint_active.stdout | default('') | trim) != 'active'
  ansible.builtin.set_fact:
    expector_maintenance_active: false

- name: Maintenance | Mark host and record info when active
  when:
    - (expector_maintenance_systemd_unit | default('') | string | trim | length) > 0
    - (_maint_active.stdout | default('') | trim) == 'active'
  block:
    - name: Maintenance | Set active flag
      ansible.builtin.set_fact:
        expector_maintenance_active: true

    - name: Maintenance | Append informational report row
      ansible.builtin.set_fact:
        host_check_results: "{{ host_check_results | default([]) + [_maint_report] }}"
      vars:
        _unit: "{{ expector_maintenance_systemd_unit | trim }}"
        _maint_report:
          check_name: "Maintenance mode"
          check_type: "maintenance"
          check_host: "{{ inventory_hostname }}"
          check_success: true
          check_failed: false
          check_unreachable: false
          error_flag: "MAINTENANCE"
          maintenance_active: true
          check_msg: "{{ _unit }} is active — checks run, remediation suppressed, failures not alerted"
          check_error: ""
          remediate_attempted: false
          remediate_success: false
          remediate_msg: ""
          remediate_error: ""
          details:
            - name: "{{ _unit }}"
              expected_state: inactive
              actual_state: active
              result: pass
              error: "Maintenance mode: verify only; remediate and failure alerts suppressed"

    - name: Maintenance | Display mode
      ansible.builtin.debug:
        msg: "Maintenance mode on {{ inventory_hostname }} ({{ expector_maintenance_systemd_unit | trim }} active) — verify only, no remediation/alerts"
