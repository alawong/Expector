---
# Skip all checks (and remediation) on this host when the maintenance unit is active.
# Included only when expector_check_maintenance_systemd_unit is true.
# Probes expector_maintenance_systemd_unit via systemctl is-active.

- name: Maintenance | Probe unit active state
  when: (expector_maintenance_systemd_unit | default('') | string | trim | length) > 0
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ expector_maintenance_systemd_unit | trim }}"
  register: _maint_active
  failed_when: false
  changed_when: false

- name: Maintenance | Record skip and end host when active
  when:
    - (expector_maintenance_systemd_unit | default('') | string | trim | length) > 0
    - (_maint_active.stdout | default('') | trim) == 'active'
  block:
    - name: Maintenance | Append skipped-host report
      ansible.builtin.set_fact:
        host_check_results: "{{ host_check_results | default([]) + [_maint_report] }}"
        expector_maintenance_active: true
      vars:
        _unit: "{{ expector_maintenance_systemd_unit | trim }}"
        _maint_report:
          check_name: "Maintenance mode"
          check_type: "maintenance"
          check_host: "{{ inventory_hostname }}"
          check_success: true
          check_failed: false
          check_unreachable: false
          error_flag: "MAINTENANCE"
          check_msg: "Host skipped; {{ _unit }} systemd unit is active (maintenance mode)"
          check_error: ""
          remediate_attempted: false
          remediate_success: false
          remediate_msg: ""
          remediate_error: ""
          details:
            - name: "{{ _unit }}"
              expected_state: inactive
              actual_state: active
              result: pass
              error: "Checks and remediation skipped while maintenance unit is active"

    - name: Maintenance | Display skip
      ansible.builtin.debug:
        msg: "Skipping checks on {{ inventory_hostname }} — {{ expector_maintenance_systemd_unit | trim }} is active"

    - name: Maintenance | End host
      ansible.builtin.meta: end_host
